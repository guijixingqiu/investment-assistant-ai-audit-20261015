        "requirements": "目的：先利用现成能力，减少自建采集与 PDF 工程。\n\n具体任务：\n\n- 实测现有 Futu SDK、OpenD 和账户对财务三表、收入构成、行情、公司行动、公告检索的支持情况。\n- 用吉利真实数据核对历史覆盖、分页、币种、单位、累计期间、重述和缺失字段。\n- 与官方报表抽样核对，明确哪些供应商数据可以使用，哪些仍需发行人原文。\n- 确定来源分工：结构化接口负责适合的数据；公司 IR／HKEX 提供关键原文；财经媒体辅助发现与背景理解。\n- 为接口响应、网页摘录和文本建立必要的来源定位，接入现有资料与财务流程，解除正式财务来源的 PDF 专用限制。\n- 复用已有公告检索、材料去重和版本机制，不另建事实库或通用采集平台。\n\n**交付：**真实可用的数据来源路径，以及明确的缺口和人工补充方式。\n\n**完成标准：**至少一种实际需要的来源能够从获取、核对到保存、引用完整走通；接口存在不再被当作项目已经接通。"
