        "requirements": "目的：在正确版本上继续开发，同时防止已知错误继续影响判断。\n\n具体任务：\n\n- 将原审计与独立复核合并到现有问题清单，逐项区分：已确认缺陷、待核验发现、体验不足、需求变更建议。\n- 补齐已有但未随复核材料提供的授权、截图和运行证据，不让你重复回答。\n- 确认产品开发分支、已修改治理文件和主线之间的实际关系；完成遗留改动归属与落地状态核对。\n- 将已知错误的量化绩效、技术可行动结论、完整性标签限制在对应范围内，不禁止查看可信历史或开展无关研究。\n- 收敛正在阻碍执行的治理规则，不再设独立“治理重建阶段”。\n\n**交付：**明确的开发起点、完整整改清单和受影响功能范围。\n\n**完成标准：**每个问题都有处理位置；“严重问题”“优先级”“阻塞范围”不再混为一谈。本步必要核对完成后即可开发，不等待所有证据补齐。"
