schema_version: 1
project: investment-assistant-system
updated_at: 2026-10-14

pull_request:
  requirements:
    - one scoped task per branch and pull request
    - no unrelated generated artifacts or local workspace changes
    - acceptance criteria stated in the pull request body
    - material fact permission data accounting client or safety changes require negative-path verification through existing checks or the actual path; new or modified test code and cases require explicit Owner permission
    - remote CI must pass before merge
    - independent review of the remote head commit
  observed_github_checks_on_exact_head:
    - Node checks
    - Risk scan
    - Exact head
  server_enforced_branch_protection:
    status: not_reverified
    note: last recorded hosting was a private GitHub Free repository; verify server protection before relying on it, otherwise use compensating controls
  exact_head_trust_requirements:
    - Exact head runs from the trusted base-branch pull_request_target workflow
    - Exact head is metadata-only and read-only
    - Exact head runs without checkout and without executing PR code
    - Exact head uses only the automatic GITHUB_TOKEN GitHub API read path and no repository secrets
    - pull requests must not control required-check execution logic
  compensating_control_mode:
    active: true
    requirements:
      - treat Node checks Risk scan and Exact head as observed exact-head checks rather than GitHub-enforced required checks
      - require local exact-head Codex source and necessary risk review before merge; independent ChatGPT review only for a genuine major-version product direction governance or architecture checkpoint or explicit Owner request
      - require clear Owner merge intent normalized to the exact active PR reviewed head and squash method after all checks pass
      - allow the Goal Pursuit central controller to execute that one bound squash merge without a repeated fixed phrase
      - forbid auto-merge
      - forbid direct pushes to main
    future_branch_protection_target_if_available:
      - require a pull request before merging
      - require status checks to pass before merging
      - require Node checks Risk scan and Exact head
      - require branches to be up to date before merging
      - forbid auto-merge
      - forbid bypassing required checks
  manual_governance:
    - explicit Owner scope permits local work without Stage mode or repeated routine permission
    - local-only delivery prohibits push Issue PR or external message writes until authorized
    - Codex reviews concrete source and necessary risks at complete repaired checkpoints; independent ChatGPT review occurs only for a genuine major-version product direction governance or architecture checkpoint or explicit Owner request, not for ordinary fixes or integration
    - P1/P2 findings isolate affected behavior and require repair rather than repeated approval
    - shared lock serializes integration and competing writes but never read-only diagnosis
    - source version scope runtime evidence and Owner acceptance remain separate
    - acceptance and waived waiting periods apply only to their documented object and scope
    - historical bootstrap exceptions are not executable
    - Stage Runner executes only its validated envelope and never merges
    - no automatic merge or direct main push

validation_policy:
  authority: AGENTS.md section 个人自用快速迭代的测试约定 governs local personal iteration across all chats and context resumes
  test_authoring: 'Owner: 没有我的允许不要写测试代码和测试用例。 Ordinary development authority does not permit new or modified test code or cases for executors reviewers or subagents across chat handoffs; existing checks still run in the smallest sufficient scope.'
  during_implementation: implementation-required reading and minimal focused checks only; no layered controller or independent code audits for each ordinary feature or repair
  checkpoint: verify the complete affected user journey once with the smallest sufficient checks selected by change and risk
  baseline_applicability: full baseline only for demonstrated broad impact major complete delivery applicable publication or merge requirements or explicit Owner request; record the concrete trigger in existing progress notes
  slice_applicability: command groups below are selection references for local iteration; matching a module name does not automatically require every listed suite pipeline or build
  repeat_checks: only after relevant code or dependency changes new failures concrete unresolved risks or explicit Owner request; changing chat context metadata or commit alone is not a trigger
  independent_review: reduced total code-checking cadence in AGENTS.md; review formed core functionality or a complete product stage, and concrete material risks only in the affected scope; ordinary local installation does not require independent source PASS and the controller must not replace it with repeated self-audits
  simulator_scope: one iPhone 17 Pro Max using the exact identity in PROJECT_STATE.yaml; no multi-device adaptation unless Owner changes scope
  documentation_only: project-state-verify and diff check; no unrelated runtime mutation
  architecture_line_budgets: advisory maintenance signals, never substitutes for semantic checks
  blocking_architecture: actual forbidden dependency and unsafe fact access
  unavailable_external_lane: NOT_RUN with reason; continue independent authorized local work
  waiver: Owner waiting waiver is recorded separately and never changes an unrun result to PASS
  stale_driver: repair stale assumptions and preserve meaningful negatives without silently skipping a required driver; new or modified test drivers require explicit Owner permission
  unit_of_acceptance: complete affected Owner journey with exact version and evidence

