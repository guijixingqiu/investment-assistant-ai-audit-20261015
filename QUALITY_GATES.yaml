product_gates:
  - the affected user journey and expected value are explicit
  - authoritative read and write facts are identified
  - loading empty stale error and permission states are handled where applicable
  - user-visible claims are supported by current evidence
  - human decisions remain distinguishable from generated suggestions
  - rollback or feature-disable behavior is defined for material changes
  - daily technical facts are usable only when both daily bars and backend indicators are available and complete; HTTP 200 alone is never success
  - completed daily bars require confirmed rights retention and derived use exact symbol timeframe QFQ calendar cutoff pagination and content hashes at a minimum of 80 bars with a target of 120
  - MA20 MA60 SMA-seeded MACD 12-26-9 Bollinger20 population variance and Wilder RSI14 are deterministic versioned backend-only calculations over one snapshot

platform_gates:
  - database migrations are forward and rollback reviewed
  - synchronization retry and idempotency behavior are tested
  - permissions and write boundaries are explicit
  - data freshness provenance and failure states are observable
  - staging production backup recovery and rollback impact are documented where applicable
  - no duplicate infrastructure is introduced without measured need

client_gates:
  - API contract compatibility is verified
  - web and iOS behavior is aligned for shared critical journeys
  - loading empty stale error offline and permission states are tested where applicable
  - simulator device or production URL smoke is run when the change requires it
  - no client silently fabricates success or freshness

data_gates:
  - authoritative source ownership is explicit
  - immutable snapshot identity is used for formal research
  - canonical payload hash is independently recomputed when snapshots are involved
  - valid source and fetchedAt provenance are recorded
  - dataCutoff and adjustment mode are explicit where applicable
  - duplicate missing invalid stale and zero-volume records are reported
  - suspension and corporate-action handling is documented for quantitative research

execution_gates:
  - day t close quantitative signals execute no earlier than day t plus 1
  - no same-bar quantitative fills
  - Hong Kong board-lot rules are enforced for Hong Kong simulations
  - no fills on missing invalid suspended or zero-volume bars
  - non-zero transaction costs are included in formal simulations
  - cash cannot become negative without an explicitly approved financing model
  - target exposure and position limits are enforced

accounting_gates:
  - cash and holdings are reconstructed independently from simulated trades
  - ledger positions and NAV reconcile
  - fees and gross amounts recompute from trade facts
  - turnover definitions are explicit and numerically tested
  - coordinated artifact tampering is rejected

research_gates:
  - research output is identified as evidence rather than an automatic decision
  - data code configuration and experiment identities are reproducible
  - failed and abandoned experiments remain registered
  - validation and final test periods are separated
  - benefits are not claimed from fixture smoke or engineering tests
  - concentration by security trade month or event is reported when applicable

safety_gates:
  - preserve the current human-decision and execution boundary
  - preserve explicit authorization audit and rollback for existing product writes
  - research modules cannot modify official transaction position or review facts
  - failed tests incidents audits experiments and health checks remain visible

merge_policy:
  allowed_when:
    - all applicable gates pass
    - pull request is mergeable
    - reviewed head SHA matches the merged head SHA
    - Node checks Risk scan and Exact head pass for the current pull-request head
    - Exact head runs from the trusted base-branch pull_request_target workflow and does not execute PR code
    - local Codex Desktop review covers the exact head and current main; independent ChatGPT review applies only at a genuine major-version product stage, material direction, governance, or architecture change, or an explicit Owner request, never for each routine merge or small fix
    - clear Owner natural-language merge intent is normalized to the unique active PR exact reviewed head and squash method after all checks pass
    - the Goal Pursuit central controller executes at most the one squash merge covered by that exact binding
  forbidden_when:
    - CI is pending failed or missing
    - evidence was generated from a different commit runtime or data snapshot
    - scope priority product or safety boundaries changed without explicit approval
    - auto-merge is enabled
    - if future server-enforced branch protection becomes available, it must not permit bypassing required checks or merging an out-of-date branch
    - a pull request controls the logic of its own required Exact head check
    - merge depends on an OpenAI Platform API key API billing API quota or another third-party review service
